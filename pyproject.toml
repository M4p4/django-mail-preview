[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77" ]

[project]
name = "django-mail-preview"
version = "0.1.0"
description = "A dev inbox and email previews for Django."
readme = "README.md"
keywords = [ "development", "django", "email", "inbox", "preview" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "M4p4", email = "homejr@protonmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "django>=5.2",
]
urls.Changelog = "https://github.com/M4p4/django-mail-preview/blob/main/CHANGELOG.md"
urls.Documentation = "https://django-mail-preview.readthedocs.io/"
urls.Issues = "https://github.com/M4p4/django-mail-preview/issues"
urls.Repository = "https://github.com/M4p4/django-mail-preview"

[dependency-groups]
test = [
  "coverage[toml]",
  "pytest",
  "pytest-django",
  "pytest-randomly",
]
# Sphinx 9 needs Python 3.12 or newer.
docs = [
  "furo; python_version>='3.12'",
  "myst-parser; python_version>='3.12'",
  "sphinx; python_version>='3.12'",
]
django52 = [ "django>=5.2,<5.3" ]
# Django 6.0 and later need Python 3.12 or newer.
django60 = [ "django>=6,<6.1; python_version>='3.12'" ]
django61 = [ "django>=6.1,<6.2; python_version>='3.12'" ]

[tool.setuptools]
packages.find.where = [ "src" ]
package-data.django_mail_preview = [
  "py.typed",
  "static/django_mail_preview/*",
  "templates/django_mail_preview/*",
]

[tool.uv]
# uv only auto-installs the `dev` group, so name the groups a bare `uv run`
# needs. The full version matrix is exercised by tox, not by the default env.
default-groups = [ "test", "django52" ]
conflicts = [
  [
    { group = "django52" },
    { group = "django60" },
    { group = "django61" },
  ],
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "." ]
ini_options.addopts = "-ra --strict-config --strict-markers"
ini_options.django_find_project = false
ini_options.django_debug_mode = "keep"
ini_options.DJANGO_SETTINGS_MODULE = "tests.settings"
